<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>武家合戦 → 武家合戦3D 引き継ぎ</title>
<style>body{margin:0;padding:28px 20px;background:#141817;color:#ece6d6;font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.8}a{color:#dcae45}</style></head>
<body><p id="m">元の武家合戦の記録を読んでいます…</p>
<script>
// 武家合戦3D hand-over page. Lives on the original 武家合戦's site (4taimao-prog.github.io), so it can read the original save.
// It only READS the original's data (yaji-*) and sends a copy back to 武家合戦3D in the address. It never changes yaji-* keys.
(function(){
const m=document.getElementById('m');
const to=new URLSearchParams(location.search).get('to')||'';
// only send to a github.io game site or a local test server
const ok=/^https:\/\/[a-z0-9-]+\.github\.io\/[^#?]*$/i.test(to)||/^http:\/\/(localhost|\[::1\])(:\d+)?\/[^#?]*$/.test(to);
if(!ok){m.innerHTML='ここは「武家合戦3D」へ記録を引き継ぐためのページです。<br>武家合戦3Dから開いてください。';return;}
// tidy: the first test of 武家合戦3D ran on this address; remove only its own leftovers (b3d-*), never yaji-*
try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(k&&k.startsWith('b3d-'))localStorage.removeItem(k);}}catch(e){}
try{caches.keys().then(ks=>ks.filter(k=>k.startsWith('buke-keep3d-')).forEach(k=>caches.delete(k))).catch(()=>{});}catch(e){}
let data={},has=false;
try{has=localStorage.getItem('yaji-v3-save')!=null;
  const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('yaji-'))ks.push(k);}
  const rank=k=>k==='yaji-v3-save'?0:k==='yaji-dai-save'?1:k==='yaji-v3-mid'?2:3;ks.sort((a,b)=>rank(a)-rank(b));
  let size=0;const MAX=1400000;// keep the address short enough for every browser; pictures go last and are skipped if too big
  for(const k of ks){const v=localStorage.getItem(k)||'';if(rank(k)===3&&size+v.length>MAX)continue;data[k]=v;size+=v.length+k.length;}
}catch(e){has=false;}
let h='none';
if(has){const u=new TextEncoder().encode(JSON.stringify(data));let b='';for(let i=0;i<u.length;i+=8192)b+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
  h=btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
m.textContent=has?'武家合戦3Dへ戻ります…':'元の武家合戦の記録はありませんでした。武家合戦3Dへ戻ります…';
location.replace(to+'#b3dimport='+h);
})();
</script></body></html>
